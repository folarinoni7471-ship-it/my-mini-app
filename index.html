<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Telegram Mini App</title>

  <!-- 1. Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. Monetag SDK Script Tag (Loads the ad library with your Zone ID) -->
  <script src="https://alwingulla.com/88/tag.min.js" data-zone="12002322" async data-cfasync="false"></script>
</head>
<body>

  <h1>Welcome to My Mini App</h1>

  <!-- 3. Your combined JavaScript logic -->
  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    console.log("Telegram User Info:", tg.initDataUnsafe?.user);

    // Initialize Monetag In-App Ads after the page loads
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof show_12002322 === 'function') {
        show_12002322({
          type: 'inApp',
          inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
          }
        });
        console.log("Monetag ads initialized successfully.");
      } else {
        console.warn("Monetag script failed to load.");
      }
    });
  </script>

</body>
</html>
